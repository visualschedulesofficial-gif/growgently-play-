<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="description" content="Free kids piano: play nursery rhymes one glowing key at a time, by Grow Gently.">
<title>Grow Gently Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Playwrite+DE+Grund:wght@100..400&display=swap">
<style>
/* Layout: one calm screen like Grow Gently Typing. Top bar; the rhyme's words in the middle with the current word lit;
   a big colourful piano across the bottom where the next key glows and a little finger bobs above it. */
:root{
  --bg:#e6efea;--panel:#ffffff;--ink:#1e3b33;--muted:#566b62;--line:#cde0d6;--btn:#eef5f1;
  --accent:#2e7d62;--accent-ink:#ffffff;--glow:#ffc61a;--good:#2e7d62;
  --font:"Playwrite DE Grund","Kalam","Noto Sans Devanagari",cursive;
  /* one colour per note, like classroom bells: C red, D orange, E yellow, F green, G teal, A blue, B purple */
  --nC:#ff8a80;--nD:#ffb74d;--nE:#ffe066;--nF:#9bd89f;--nG:#7fdbe6;--nA:#8ec5fb;--nB:#cf9ade;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1a16;--panel:#17241f;--ink:#ecf4ef;--muted:#9db3a9;--line:#2b3e35;--btn:#20302a;--accent:#5cc29c;--accent-ink:#0b1a14;--glow:#ffd23f;--good:#5cc29c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a16;--panel:#17241f;--ink:#ecf4ef;--muted:#9db3a9;--line:#2b3e35;--btn:#20302a;--accent:#5cc29c;--accent-ink:#0b1a14;--glow:#ffd23f;--good:#5cc29c;color-scheme:dark}

[hidden]{display:none!important}
body{font-synthesis:none;line-height:1.45}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0;overflow:hidden}
svg.i{width:24px;height:24px;fill:currentColor;flex:none;display:block}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{height:100%;box-sizing:border-box;padding-block:12px;padding-inline:16px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;max-width:1280px;margin:0 auto}

.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-size:22px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand small{font-size:15px;color:var(--muted)}
.badge{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.badge svg.i{fill:#fff;width:26px;height:26px}
.pill{appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 14px;display:flex;align-items:center;gap:6px;font-size:15px}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:16px 20px 20px;min-height:0;position:relative;overflow:hidden}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-weight:400;font-size:22px;line-height:1.4}
.head p{margin:0;color:var(--muted);font-size:15px}
.bar{flex:1 1 200px;max-width:340px;height:14px;border-radius:999px;background:var(--btn);border:2px solid var(--line);overflow:hidden;margin-left:auto}
.bar i{display:block;height:100%;width:0;background:var(--glow);transition:width .2s}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.lyrics{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px 8px;overflow:auto;padding:6px;min-height:0}
.line{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%}
.syl{font-size:clamp(22px,4.4vh,40px);line-height:1.35;padding:2px 10px 4px;border-radius:12px;border:3px solid transparent;color:var(--muted);position:relative}
.syl .dot{position:absolute;left:50%;bottom:-6px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%)}
.syl.done{color:var(--good)}
.syl.now{color:var(--ink);background:color-mix(in srgb,var(--glow) 30%,transparent);border-color:var(--glow)}
.hint{text-align:center;font-size:18px;color:var(--muted);min-height:1.6em}
.hint b{color:var(--ink);font-weight:400}

/* piano */
.piano{--wk:clamp(26px,min(8.6vw,13vh,calc((100vw - 120px) / 10)),110px);position:relative;display:flex;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;padding-top:34px}
.keys{position:relative;display:flex;gap:4px}
.wk{width:var(--wk);height:calc(var(--wk)*2.3);border-radius:0 0 16px 16px;background:#fff;border:2px solid #b9c9c0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.08);overflow:hidden}
.wk .band{position:absolute;left:0;right:0;bottom:0;height:42%;background:var(--c);opacity:.9}
.wk .lab{position:relative;font-size:calc(var(--wk)*.36);color:#1e3b33;padding-bottom:10px;line-height:1}
.bk{position:absolute;top:0;width:calc(var(--wk)*.62);height:calc(var(--wk)*1.4);background:#23302b;border-radius:0 0 10px 10px;z-index:2;
  display:flex;align-items:flex-end;justify-content:center;color:#cfe0d7;font-size:calc(var(--wk)*.2);padding-bottom:6px;box-sizing:border-box;box-shadow:inset 0 -6px 0 rgba(255,255,255,.08)}
.wk.press,.bk.press{transform:translateY(3px);filter:brightness(.92)}
.wk.lit{outline:6px solid var(--glow);outline-offset:-2px;animation:glow 1s ease-in-out infinite;z-index:1}
.bk.lit{outline:5px solid var(--glow);animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{outline-color:color-mix(in srgb,var(--glow) 35%,transparent)}}
.finger{position:absolute;top:0;width:32px;height:32px;margin-left:-16px;color:var(--accent);animation:bob .8s ease-in-out infinite;pointer-events:none;z-index:3}
.finger svg{width:32px;height:32px;fill:currentColor;transform:rotate(180deg)}
@keyframes bob{50%{transform:translateY(8px)}}
.kbhint{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}

/* screens */
.screen{position:absolute;inset:0;z-index:5;background:var(--panel);display:grid;place-items:center;padding:20px;overflow:auto}
.center{display:grid;gap:14px;justify-items:center;text-align:center;width:min(900px,100%)}
.center h2{margin:0;font-weight:400;font-size:clamp(26px,4.5vh,38px);line-height:1.3}
.center p{margin:0;font-size:18px;color:var(--muted);max-width:56ch}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;width:100%}
.song{appearance:none;border:2px solid var(--line);background:var(--btn);color:var(--ink);border-radius:18px;padding:14px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.song .ic{grid-row:1/3;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent)}
.song .ic svg.i{fill:#fff;width:30px;height:30px}
.song b{font-weight:400;font-size:17px;line-height:1.25}
.song span{font-size:13px;color:var(--muted)}
.song .stars{display:flex;gap:2px}.song .stars svg{width:15px;height:15px;fill:var(--line)}.song .stars svg.got{fill:var(--glow)}
.song.free .ic{background:var(--glow)}.song.free .ic svg.i{fill:#1e3b33}
.big{appearance:none;border:0;background:var(--glow);color:#1e3b33;font-size:22px;border-radius:18px;padding:12px 28px;display:inline-flex;gap:8px;align-items:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.big.alt{background:var(--btn);color:var(--ink);font-size:18px}
.prize svg{width:110px;height:110px;fill:var(--accent)}
.won{display:flex;gap:6px}.won svg{width:52px;height:52px;fill:var(--line)}.won svg.got{fill:var(--glow)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:999px;font-size:15px;pointer-events:none;max-width:calc(100% - 24px);text-align:center;overflow-wrap:anywhere}

@media (max-width:1100px){#fsBtn span,#shareBtn span,#labBtn span{display:none}}
@media (max-width:700px){.brand small{display:none}.kbhint{display:none}.stage{padding:12px}}
@media (prefers-reduced-motion:reduce){.wk.lit,.bk.lit,.finger{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand" id="brand"></div>
    <button type="button" class="pill" id="songsBtn"></button>
    <button type="button" class="pill" id="labBtn"></button>
    <button type="button" class="pill" id="fsBtn"></button>
    <button type="button" class="pill" id="shareBtn"></button>
  </header>
  <main class="stage" id="stage">
    <div class="head">
      <div><h1 id="title">Free play · खुद बजाओ</h1><p id="sub">Play any key you like</p></div>
      <div class="acts" id="acts">
        <button type="button" class="pill" id="listenBtn"></button>
        <button type="button" class="pill" id="restartBtn"></button>
      </div>
      <div class="bar" id="bar" aria-label="Progress"><i id="barFill"></i></div>
    </div>
    <div class="lyrics" id="lyrics" aria-live="polite"></div>
    <div class="hint" id="hint"></div>
    <div><div class="piano" id="piano"><div class="keys" id="keys"></div></div>
      <div class="kbhint">On a computer you can also use the keys A S D F G H J K L ; and W E T Y U O P for the black keys</div></div>

    <section class="screen" id="songScreen">
      <div class="center">
        <h2>Pick a rhyme · गाना चुनो</h2>
        <p>Tap a rhyme. Press Listen to hear it first, then play it one glowing key at a time.</p>
        <div class="songs" id="songs"></div>
      </div>
    </section>
    <section class="screen" id="doneScreen" hidden>
      <div class="center">
        <div class="prize" id="prize"></div>
        <h2 id="doneTitle">You played it!</h2>
        <div class="won" id="won"></div>
        <p id="doneText"></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button type="button" class="big alt" id="againBtn"></button>
          <button type="button" class="big" id="nextBtn"></button>
        </div>
      </div>
    </section>
    <div class="toast" id="toast" hidden></div>
  </main>
</div>

   ['Hot cross buns','E4 D4 C4','1 1 2'],
   ['hot cross buns','E4 D4 C4','1 1 2'],
   ['one a pen ny, two a pen ny','C4 C4 C4 C4 D4 D4 D4 D4','.5 .5 .5 .5 .5 .5 .5 .5'],
   ['hot cross buns','E4 D4 C4','1 1 2']]},
 {id:'jingle',t:'Jingle Bells',ic:'notifications',lines:[
   ['Jin gle bells','E4 E4 E4','1 1 2'],
   ['jin gle bells','E4 E4 E4','1 1 2'],
   ['jin gle all the way','E4 G4 C4 D4 E4','1 1 1.5 .5 4'],
   ['Oh what fun it is to ride in a one horse o pen sleigh','F4 F4 F4 F4 F4 E4 E4 E4 E4 D4 D4 E4 D4 G4','1 1 1.5 .5 1 1 1 .5 .5 1 1 1 1 2'],
   ['Jin gle bells','E4 E4 E4','1 1 2'],
   ['jin gle bells','E4 E4 E4','1 1 2'],
   ['jin gle all the way','E4 G4 C4 D4 E4','1 1 1.5 .5 4'],
   ['Oh what fun it is to ride in a one horse o pen sleigh','F4 F4 F4 F4 F4 E4 E4 E4 E4 G4 G4 F4 D4 C4','1 1 1.5 .5 1 1 1 .5 .5 1 1 1 1 4']]},
];
SONGS.forEach(s=>{s.seq=[];s.lines.forEach((l,li)=>{const sy=l[0].split(' '),no=l[1].split(' '),be=(l[2]||'').split(' ').map(Number);
  if(sy.length!==no.length)console.warn('mismatch',s.id,li,sy.length,no.length);
  sy.forEach((w,i)=>s.seq.push({w,n:no[i],b:be[i]||1,line:li}))})});

/* ---------- saved on this device ---------- */
let best={},sargam=false;
try{best=JSON.parse(localStorage.getItem('ggp-best')||'{}')||{};sargam=localStorage.getItem('ggp-sargam')==='1'}catch(_){}
const store=()=>{try{localStorage.setItem('ggp-best',JSON.stringify(best));localStorage.setItem('ggp-sargam',sargam?'1':'0')}catch(_){}};

/* ---------- sound: a soft piano made in the browser ---------- */
let ac=null;
function play(n,len=.9){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const f=FREQ(n),t=ac.currentTime,g=ac.createGain();g.connect(ac.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.008);g.gain.exponentialRampToValueAtTime(.12,t+.25);g.gain.exponentialRampToValueAtTime(.001,t+len+.6);
  [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12]].forEach(([m,type,v])=>{const o=ac.createOscillator(),og=ac.createGain();o.type=type;o.frequency.value=f*m;og.gain.value=v;o.connect(og).connect(g);o.start(t);o.stop(t+len+.7)})}catch(_){}}

/* ---------- draw the keys ---------- */
const keyEls={};
function buildPiano(){
  const k=$('keys');k.innerHTML='';
  WHITE.forEach(n=>{const el=document.createElement('div');el.className='wk';el.dataset.n=n;el.style.setProperty('--c',`var(--n${n[0]})`);
    el.innerHTML=`<span class="band"></span><span class="lab"></span>`;k.appendChild(el);keyEls[n]=el});
  BLACK.forEach(([n,i])=>{const el=document.createElement('div');el.className='bk';el.dataset.n=n;el.dataset.after=i;k.appendChild(el);keyEls[n]=el});
  const f=document.createElement('div');f.className='finger';f.id='finger';f.hidden=true;f.innerHTML=icon('touch_app');$('piano').appendChild(f);
  placeBlack();labels()}
function placeBlack(){const ws=[...document.querySelectorAll('.wk')];
  document.querySelectorAll('.bk').forEach(b=>{const w=ws[+b.dataset.after];b.style.left=(w.offsetLeft+w.offsetWidth-b.offsetWidth/2+2)+'px'})}
function labels(){WHITE.forEach(n=>keyEls[n].querySelector('.lab').textContent=sargam?SARGAM[n[0]]:n[0]);
  BLACK.forEach(([n])=>keyEls[n].textContent=sargam?'':n[0]+'♯');
  $('labBtn').innerHTML=icon('translate')+`<span>${sargam?'सा रे ग':'C D E'}</span>`;$('labBtn').title='Key names: letters or sargam'}
function moveFinger(n){const f=$('finger');if(!n){f.hidden=true;return}const el=keyEls[n],p=$('piano').getBoundingClientRect(),r=el.getBoundingClientRect();
  f.hidden=false;f.style.left=(r.left-p.left+r.width/2)+'px'}

/* ---------- game ---------- */
let song=null,pos=0,firstTry=true,right=0,total=0,demo=null;
function noteName(n){return sargam?(SARGAM[n[0]]+(n.includes('#')?' ♯':'')):n.replace(/\d/,'').replace('#','♯')}
function renderLyrics(){
  const box=$('lyrics');box.innerHTML='';if(!song){box.innerHTML='<div class="line"><span class="syl now">Play any key · कोई भी बटन दबाओ</span></div>';return}
  let idx=0;song.lines.forEach((l,li)=>{const d=document.createElement('div');d.className='line';
    l[0].split(' ').forEach(w=>{const s=document.createElement('span');s.className='syl'+(idx<pos?' done':'')+(idx===pos?' now':'');s.dataset.i=idx;
      s.innerHTML=`${w}<i class="dot" style="background:var(--n${song.seq[idx].n[0]})"></i>`;d.appendChild(s);idx++});box.appendChild(d)});
  const now=box.querySelector('.syl.now');if(now){const r=now.getBoundingClientRect(),br=box.getBoundingClientRect();if(r.top<br.top||r.bottom>br.bottom)box.scrollTop+=r.top-br.top-br.height/3}}
function light(n){Object.values(keyEls).forEach(k=>k.classList.remove('lit'));if(n&&keyEls[n])keyEls[n].classList.add('lit');moveFinger(n)}
function update(){
  $('barFill').style.width=song?(pos/song.seq.length*100)+'%':'0';
  renderLyrics();
  if(!song||pos>=song.seq.length){light(null);$('hint').textContent=song?'Well done · शाबाश':'';return}
  const n=song.seq[pos].n;light(n);$('hint').innerHTML=`Press the glowing key: <b>${noteName(n)}</b>`}
function startSong(s){stopDemo();song=s;pos=0;right=0;total=0;firstTry=true;
  $('title').textContent=s.t;$('sub').textContent='Tap the glowing key · चमकता बटन दबाओ';$('acts').hidden=false;$('bar').hidden=false;
  ['songScreen','doneScreen'].forEach(x=>$(x).hidden=true);update()}
function freePlay(){stopDemo();song=null;$('title').textContent='Free play · खुद बजाओ';$('sub').textContent='Play any key you like';$('acts').hidden=true;$('bar').hidden=true;
  ['songScreen','doneScreen'].forEach(x=>$(x).hidden=true);update()}
function press(n){
  const el=keyEls[n];if(!el)return;play(n);el.classList.add('press');setTimeout(()=>el.classList.remove('press'),140);
  if(!song||demo)return;
  const want=song.seq[pos].n;
  if(n===want){total++;if(firstTry)right++;firstTry=true;pos++;
    if(pos>=song.seq.length){update();setTimeout(finish,700);return}update()}
  else{if(firstTry)total++;firstTry=false;$('hint').innerHTML=`Try the glowing key: <b>${noteName(want)}</b>`}}
function finish(){
  const acc=total?right/total:1,stars=acc>=.9?3:acc>=.7?2:1;best[song.id]=Math.max(best[song.id]||0,stars);store();
  light(null);$('prize').innerHTML=icon(song.ic);
  $('doneTitle').textContent=['You played it!','Lovely playing!','Super star!'][stars-1];
  $('won').innerHTML=[0,1,2].map(i=>icon('star',i<stars?'got':'')).join('');
  $('doneText').textContent=`You played "${song.t}". ${right} of ${total} notes were right on the first try.`;
  $('againBtn').innerHTML=icon('replay')+'Play again';$('againBtn').onclick=()=>startSong(song);
  const next=SONGS[(SONGS.indexOf(song)+1)%SONGS.length];$('nextBtn').innerHTML=icon('arrow_forward')+'Next rhyme';$('nextBtn').onclick=()=>startSong(next);
  $('doneScreen').hidden=false;
  // a little tune to celebrate
  ['C4','E4','G4','C5'].forEach((n,i)=>setTimeout(()=>play(n,.4),i*130))}

/* listen first: the app plays the rhyme with the keys and words lighting up */
function stopDemo(){if(!demo)return;demo.forEach(clearTimeout);demo=null;$('listenBtn').innerHTML=icon('volume_up')+'<span>Listen · सुनो</span>';if(song)update()}
function listen(){
  if(demo){stopDemo();return}
  const beat=480,saved=pos;demo=[];let t=0;
  $('listenBtn').innerHTML=icon('stop')+'<span>Stop · रुको</span>';
  song.seq.forEach((s,i)=>{demo.push(setTimeout(()=>{pos=i;renderLyrics();light(s.n);play(s.n,s.b*beat/1000);
      keyEls[s.n].classList.add('press');setTimeout(()=>keyEls[s.n].classList.remove('press'),160)},t));t+=s.b*beat});
  demo.push(setTimeout(()=>{demo=null;pos=saved;$('listenBtn').innerHTML=icon('volume_up')+'<span>Listen · सुनो</span>';update()},t+300))}

/* ---------- touch, mouse and computer keys ---------- */
$('keys').addEventListener('pointerdown',e=>{const k=e.target.closest('.wk,.bk');if(!k)return;e.preventDefault();press(k.dataset.n)});
document.addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;const n=KEYMAP[e.key.toLowerCase()];if(n){e.preventDefault();press(n)}});

/* ---------- song list ---------- */
function openSongs(){stopDemo();const box=$('songs');box.innerHTML='';
  SONGS.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='song';b.id='song-'+s.id;
    b.innerHTML=`<span class="ic">${icon(s.ic)}</span><b>${s.t}</b><span class="stars">${[0,1,2].map(i=>icon('star',i<(best[s.id]||0)?'got':'')).join('')}</span>`;
    b.onclick=()=>startSong(s);box.appendChild(b)});
  const f=document.createElement('button');f.type='button';f.className='song free';f.id='song-free';
  f.innerHTML=`<span class="ic">${icon('piano')}</span><b>Free play · खुद बजाओ</b><span>Make your own music</span>`;f.onclick=freePlay;box.appendChild(f);
  $('doneScreen').hidden=true;$('songScreen').hidden=false}

/* ---------- top bar ---------- */
$('brand').innerHTML='<span class="badge">'+icon('piano')+'</span>Grow Gently Piano <small>· पियानो बजाओ</small>';
$('songsBtn').innerHTML=icon('queue_music')+'Rhymes';$('songsBtn').onclick=openSongs;
$('labBtn').onclick=()=>{sargam=!sargam;store();labels();if(song)update()};
$('listenBtn').innerHTML=icon('volume_up')+'<span>Listen · सुनो</span>';$('listenBtn').onclick=listen;
$('restartBtn').innerHTML=icon('replay')+'<span>Start over</span>';$('restartBtn').onclick=()=>song&&startSong(song);

const SHARE_URL='https://visualschedulesofficial-gif.github.io/growgently-play-/piano/';
/* ---------- full screen + share (helps when the app sits inside a website page) ---------- */
(()=>{
  const fsBtn=document.getElementById('fsBtn'),shareBtn=document.getElementById('shareBtn');
  const inFrame=(()=>{try{return window.self!==window.top}catch(_){return true}})();
  const de=document.documentElement,canFS=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const paint=()=>{fsBtn.innerHTML=icon(isFS()?'fullscreen_exit':canFS?'fullscreen':'open_in_new')+`<span>${isFS()?'Exit full screen':canFS?'Full screen':'Open full screen'}</span>`};
  if(!canFS&&!inFrame)fsBtn.hidden=true;
  paint();document.addEventListener('fullscreenchange',paint);document.addEventListener('webkitfullscreenchange',paint);
  fsBtn.onclick=async()=>{
    if(isFS()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(_){}return}
    if(canFS){try{await (de.requestFullscreen||de.webkitRequestFullscreen).call(de);return}catch(_){}}
    window.open(location.href.split('#')[0],'_blank','noopener')};
  shareBtn.innerHTML=icon('share')+'<span>Share</span>';
  shareBtn.onclick=async()=>{
    const data={title:document.title,text:'Free for kids, from Grow Gently',url:SHARE_URL};
    if(navigator.share){try{await navigator.share(data);return}catch(e){if(e&&e.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(SHARE_URL);toast('Link copied · लिंक कॉपी हो गया')}catch(_){toast(SHARE_URL,7000)}};
})();

buildPiano();openSongs();freePlay();$('songScreen').hidden=false;
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{placeBlack();if(song)moveFinger(song.seq[pos]?.n)},120)});
document.fonts&&document.fonts.ready.then(()=>{placeBlack();if(song)moveFinger(song.seq[pos]?.n)});
})();
</script>

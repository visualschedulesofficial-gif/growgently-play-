<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="description" content="Grow Gently Code: a free coding game for kids. Tap arrow and jump blocks to guide a monster to ice cream, gold and ships. English and Hindi.">
<title>Grow Gently Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Playwrite+DE+Grund:wght@100..400&display=swap">
<style>
/* Layout: the board where the monster walks fills the left; on the right sits a card with the goal,
   the command blocks to tap, and "your code" boxes, just like the worksheet. Play runs the code step by step. */
:root{
  --bg:#e6efea;--panel:#ffffff;--ink:#1e3b33;--muted:#566b62;--line:#cde0d6;--btn:#eef5f1;
  --accent:#2e7d62;--accent-ink:#fff;--glow:#ffc61a;
  --block:#3d8fe0;--block-ink:#ffffff;--jump:#7a5bbf;
  --path:#fdf6e3;--path-line:#e7dcc0;--grass:#a8d89a;--grass2:#98cf8a;--water:#7cc4f0;
  --font:"Playwrite DE Grund","Kalam","Noto Sans Devanagari",cursive;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1a16;--panel:#17241f;--ink:#ecf4ef;--muted:#9db3a9;--line:#2b3e35;--btn:#20302a;--accent:#5cc29c;--accent-ink:#0b1a14;--glow:#ffd23f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a16;--panel:#17241f;--ink:#ecf4ef;--muted:#9db3a9;--line:#2b3e35;--btn:#20302a;--accent:#5cc29c;--accent-ink:#0b1a14;--glow:#ffd23f;color-scheme:dark}

[hidden]{display:none!important}
body{font-synthesis:none;line-height:1.45}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0;overflow:hidden}
svg.i{width:24px;height:24px;fill:currentColor;flex:none;display:block}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{height:100%;box-sizing:border-box;padding-block:12px;padding-inline:16px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;max-width:1320px;margin:0 auto}

.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-size:22px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand small{font-size:15px;color:var(--muted)}
.badge{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.badge svg.i{fill:#fff;width:26px;height:26px}
.pill{appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 14px;display:flex;align-items:center;gap:6px;font-size:15px}
.mon{font-family:var(--emoji);font-size:22px;line-height:1;padding:3px 10px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;min-height:0;position:relative}
.boardcard{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:14px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0;min-width:0}
.lvl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvl h1{margin:0;font-weight:400;font-size:20px;line-height:1.4}
.lvl .tag{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 12px;font-size:14px}
.lvl .got{margin-left:auto;display:flex;gap:2px}
.lvl .got svg{width:22px;height:22px;fill:var(--line)}.lvl .got svg.on{fill:var(--glow)}
.boardwrap{position:relative;display:grid;place-items:center;min-height:0;min-width:0}
.board{position:relative;display:grid;gap:4px;padding:6px;border-radius:18px;background:#7fb86f}
.cell{width:var(--c);height:var(--c);border-radius:10px;display:grid;place-items:center;font-family:var(--emoji);font-size:calc(var(--c)*.55);line-height:1;position:relative}
.cell.g{background:var(--grass)}.cell.g:nth-child(2n){background:var(--grass2)}
.cell.p{background:var(--path);box-shadow:inset 0 -4px 0 var(--path-line)}
.cell.w{background:var(--water);box-shadow:inset 0 -4px 0 #5aa9db}
.cell .deco{opacity:.85;font-size:calc(var(--c)*.45)}
.cell .star{animation:twinkle 1.6s ease-in-out infinite}
.cell .gl{font-size:calc(var(--c)*.7);animation:bounce 1.2s ease-in-out infinite}
.cell .gone{animation:pop .4s forwards}
@keyframes twinkle{50%{transform:scale(1.15) rotate(8deg)}}
@keyframes bounce{50%{transform:translateY(-6%)}}
@keyframes pop{to{transform:scale(2);opacity:0}}
.hero{position:absolute;left:0;top:0;width:var(--c);height:var(--c);display:grid;place-items:center;font-family:var(--emoji);font-size:calc(var(--c)*.72);line-height:1;
  transition:transform .32s ease-in-out;z-index:3;pointer-events:none}
.hero .face{display:block;transition:transform .2s}
.hero.left .face{transform:scaleX(-1)}
.hero.hop .face{animation:hop .42s ease-in-out}
.hero.bump .face{animation:bump .35s}
.hero.sink .face{animation:sink .6s forwards}
.hero.party .face{animation:party .5s ease-in-out 3}
@keyframes hop{40%{transform:translateY(-70%) scale(1.1)}}
.hero.left.hop .face{animation-name:hopl}@keyframes hopl{0%,100%{transform:scaleX(-1)}40%{transform:scaleX(-1) translateY(-70%) scale(1.1)}}
@keyframes bump{30%{transform:translateX(18%) rotate(10deg)}60%{transform:translateX(-8%) rotate(-8deg)}}
@keyframes sink{to{transform:translateY(30%) scale(.4);opacity:.2}}
@keyframes party{50%{transform:translateY(-25%) rotate(-12deg) scale(1.15)}}
/* planned path: shows where the code will take the monster, step by step */
.trail{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
.trail svg.line{position:absolute;left:0;top:0;overflow:visible}
.trail .ln{fill:none;stroke:var(--block);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 11;opacity:.75}
.tk{position:absolute;left:0;top:0;width:var(--c);height:var(--c);display:grid;place-items:center;transition:opacity .35s,transform .35s}
.tk i{position:relative;width:46%;height:46%;border-radius:30%;background:var(--block);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tk i svg{width:80%;height:80%;fill:#fff}
.tk b{position:absolute;right:-9px;top:-9px;min-width:1.5em;height:1.5em;border-radius:999px;background:#fff;color:#1e3b33;font:400 11px/1.5em system-ui,sans-serif;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tk.J i{background:var(--jump)}
.tk.x i{background:#e03131}
.tk.new{animation:tkpop .4s ease-out}
.tk.done{opacity:0;transform:scale(.4)}
@keyframes tkpop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.hero.walk{transition:transform .42s linear}
.hero.walk:not(.hop) .face{animation:waddle .42s ease-in-out infinite}
.hero.walk.left:not(.hop) .face{animation-name:waddlel}
@keyframes waddle{25%{transform:rotate(-7deg) translateY(-6%)}75%{transform:rotate(7deg) translateY(-6%)}}
@keyframes waddlel{0%,50%,100%{transform:scaleX(-1)}25%{transform:scaleX(-1) rotate(-7deg) translateY(-6%)}75%{transform:scaleX(-1) rotate(7deg) translateY(-6%)}}

/* side panel */
.side{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.goal{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--glow) 22%,var(--panel));border:2px solid var(--glow);border-radius:16px;padding:10px 12px}
.goal .e{font-family:var(--emoji);font-size:44px;line-height:1}
.goal b{display:block;font-weight:400;font-size:18px;line-height:1.3}
.goal span{font-size:14px;color:var(--muted)}
.sec{font-size:15px;color:var(--muted);margin:0}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.blk{appearance:none;border:0;background:var(--block);color:var(--block-ink);border-radius:14px;width:64px;height:64px;display:grid;place-items:center;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.blk svg.i{width:40px;height:40px;fill:#fff}
.blk.J{background:var(--jump)}
.blk:active{transform:translateY(2px)}
.blk[disabled]{opacity:.35;cursor:not-allowed}
.pal .lab{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.2}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:48px;height:48px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;background:var(--btn);padding:0}
.slot.f{border:0;background:var(--block);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.slot.f.J{background:var(--jump)}
.slot svg.i{width:30px;height:30px;fill:#fff}
.slot.run{outline:4px solid var(--glow);outline-offset:2px}
.slot.bad{outline:4px solid #e03131;outline-offset:2px}
.runrow{display:flex;gap:8px;flex-wrap:wrap}
.play{appearance:none;border:0;background:var(--glow);color:#1e3b33;font-size:22px;border-radius:16px;padding:10px 26px;display:inline-flex;gap:6px;align-items:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14);flex:1;justify-content:center}
.play svg.i{width:30px;height:30px}
.small{appearance:none;border:2px solid var(--line);background:var(--btn);color:var(--ink);border-radius:14px;padding:8px 12px;display:inline-flex;gap:4px;align-items:center;font-size:15px}
.msg{min-height:1.5em;font-size:17px;text-align:center;margin:0}

.screen{position:absolute;inset:0;z-index:6;background:var(--panel);border-radius:24px;display:grid;place-items:center;padding:20px;overflow:auto;border:1px solid var(--line)}
.center{display:grid;gap:14px;justify-items:center;text-align:center;width:min(980px,100%)}
.center h2{margin:0;font-weight:400;font-size:clamp(26px,4.5vh,38px);line-height:1.3}
.center p{margin:0;font-size:18px;color:var(--muted);max-width:60ch}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%}
.lv{appearance:none;border:2px solid var(--line);background:var(--btn);color:var(--ink);border-radius:16px;padding:10px;display:grid;justify-items:center;gap:2px}
.lv .e{font-family:var(--emoji);font-size:34px;line-height:1.1}
.lv b{font-weight:400;font-size:15px;line-height:1.2}
.lv small{font-size:12px;color:var(--muted)}
.lv .st{display:flex;gap:2px}.lv .st svg{width:15px;height:15px;fill:var(--line)}.lv .st svg.on{fill:var(--glow)}
.mons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mons button{font-family:var(--emoji);font-size:38px;line-height:1;width:64px;height:64px;border-radius:16px;border:3px solid var(--line);background:var(--btn)}
.mons button[aria-pressed="true"]{border-color:var(--accent);background:var(--panel)}
.big{appearance:none;border:0;background:var(--glow);color:#1e3b33;font-size:22px;border-radius:18px;padding:12px 28px;display:inline-flex;gap:8px;align-items:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.big.alt{background:var(--btn);color:var(--ink);font-size:18px}
.wonE{font-family:var(--emoji);font-size:90px;line-height:1}
.won{display:flex;gap:6px}.won svg{width:52px;height:52px;fill:var(--line)}.won svg.on{fill:var(--glow)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:999px;font-size:15px;pointer-events:none;max-width:calc(100% - 24px);text-align:center;overflow-wrap:anywhere}

@media (max-width:1100px){#fsBtn span,#shareBtn span,#voiceBtn span{display:none}}
@media (max-width:860px){
  body{overflow:auto}html,body{height:auto}
  .wrap{height:auto;min-height:100%}
  .stage{grid-template-columns:minmax(0,1fr)}
  .brand small{display:none}
  .blk{width:56px;height:56px}
}
@media (prefers-reduced-motion:reduce){.cell .star,.cell .gl{animation:none}.hero{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand" id="brand"></div>
    <button type="button" class="pill" id="levelsBtn"></button>
    <button type="button" class="pill mon" id="monBtn" aria-label="Pick your monster"></button>
    <button type="button" class="pill" id="voiceBtn"></button>
    <button type="button" class="pill" id="fsBtn"></button>
    <button type="button" class="pill" id="shareBtn"></button>
  </header>
  <main class="stage" id="stage">
    <section class="boardcard">
      <div class="lvl"><span class="tag" id="lvlTag">Level 1</span><h1 id="lvlName"></h1><span class="got" id="got"></span></div>
      <div class="boardwrap" id="boardwrap"><div class="board" id="board"></div></div>
    </section>
    <aside class="side">
      <div class="goal"><span class="e" id="goalE"></span><div><b id="goalT"></b><span id="goalH"></span></div></div>
      <p class="sec">Tap the blocks to write your code · ब्लॉक दबाओ</p>
      <div class="palette" id="palette"></div>
      <p class="sec" id="codeLbl">Your code · तुम्हारा कोड</p>
      <div class="slots" id="slots"></div>
      <div class="runrow">
        <button type="button" class="play" id="playBtn"></button>
        <button type="button" class="small" id="undoBtn" aria-label="Remove last block"></button>
        <button type="button" class="small" id="clearBtn" aria-label="Clear all blocks"></button>
      </div>
      <p class="msg" id="msg" aria-live="polite"></p>
    </aside>

    <section class="screen" id="levelScreen">
      <div class="center">
        <h2>Pick a level · लेवल चुनो</h2>
        <p>Write code with arrow blocks to move your monster. Collect the stars and reach the goal.</p>
        <div class="levels" id="levels"></div>
      </div>
    </section>
    <section class="screen" id="monScreen" hidden>
      <div class="center">
        <h2>Pick your monster · अपना मॉन्स्टर चुनो</h2>
        <div class="mons" id="mons"></div>
        <button type="button" class="big" id="monDone"></button>
      </div>
    </section>
    <section class="screen" id="winScreen" hidden>
      <div class="center">
        <div class="wonE" id="winE"></div>
        <h2 id="winT"></h2>
        <div class="won" id="winStars"></div>
        <p id="winP"></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button type="button" class="big alt" id="againBtn"></button>
          <button type="button" class="big" id="nextBtn"></button>
        </div>
      </div>
    </section>
    <div class="toast" id="toast" hidden></div>
  </main>

function osc(type,f0,f1,dur,vol=.18,delay=0){const a=A();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();

  let n=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const ch=grid[y][x],c=document.createElement('div');c.dataset.x=x;c.dataset.y=y;
    if(ch==='#'){c.className='cell g';if((x*7+y*13+L)%4===0)c.innerHTML=`<span class="deco">${DECO[(x+y+L)%DECO.length]}</span>`}
    else if(ch==='W'){c.className='cell w';c.innerHTML='<span class="deco">💧</span>'}
    else{c.className='cell p';if(ch==='*')c.innerHTML='<span class="star">⭐</span>';if(ch==='G')c.innerHTML=`<span class="gl">${GOALS[lv.g].e}</span>`}
    b.appendChild(c);n++}
  const tr=document.createElement('div');tr.className='trail';tr.id='trail';b.appendChild(tr);
  hero=document.createElement('div');hero.className='hero';hero.innerHTML=`<span class="face">${mon}</span>`;b.appendChild(hero);
  fit();place(start,'R',true);updGot()}
function fit(){const r=$('boardwrap').getBoundingClientRect();if(!r.width)return;
  const narrow=innerWidth<=860,availH=narrow?Math.min(innerWidth*.9,420):r.height-20;
  cellSize=Math.max(30,Math.min(96,Math.floor((r.width-12-4*(W-1)-8)/W),Math.floor((availH-12-4*(H-1))/H)));
  $('board').style.setProperty('--c',cellSize+'px');if(pos)place(pos,face,true);if(!running)preview()}
function place(p,f,instant){pos=p;face=f;if(!hero)return;
  if(instant){hero.style.transition='none'}
  hero.style.transform=`translate(${6+p[0]*(cellSize+4)}px,${6+p[1]*(cellSize+4)}px)`;
  hero.classList.toggle('left',f==='L');
  if(instant){void hero.offsetWidth;hero.style.transition=''}}
function updGot(){const total=lv.m.join('').split('*').length-1;$('got').innerHTML=Array.from({length:total},(_,i)=>icon('star',i<got.size?'on':'')).join('')}
function msg(t){$('msg').textContent=t}

/* ---------- planned path preview ---------- */
function sim(){const out=[];let p=[...start],f='R';
  for(let i=0;i<prog.length;i++){const k=prog[i];let np,mid=null;
    if(k==='J'){const d=DIRS[f];mid=[p[0]+d[0],p[1]+d[1]];np=[p[0]+2*d[0],p[1]+2*d[1]]}else{const d=DIRS[k];f=k;np=[p[0]+d[0],p[1]+d[1]]}
    const dest=at(np[0],np[1]);
    if(k==='J'&&at(mid[0],mid[1])==='#'||dest==='#'){let t=k==='J'&&at(mid[0],mid[1])==='#'?mid:np;if(t[0]<0||t[1]<0||t[0]>=W||t[1]>=H)t=p;out.push({k,to:t,bad:1,from:p});break}
    out.push({k,to:np,from:p,bad:dest==='W'?1:0});p=np;if(dest==='W'||dest==='G')break}
  return out}
let shown=0;
function preview(){const tr=$('trail');if(!tr||!lv)return;const st=sim(),c=cellSize,ctr=q=>[6+q[0]*(c+4)+c/2,6+q[1]*(c+4)+c/2];
  const pts=[ctr(start)].concat(st.map(s=>ctr(s.to)));
  let h=`<svg class="line" width="1" height="1"><polyline class="ln" points="${pts.map(q=>q.join(',')).join(' ')}"/></svg>`;
  st.forEach((s,i)=>{const tx=6+s.to[0]*(c+4),ty=6+s.to[1]*(c+4);
    h+=`<div class="tk ${s.k}${s.bad?' x':''}${i>=shown?' new':''}" id="tk-${i}" style="translate:${tx}px ${ty}px"><i>${icon(BLOCKS[s.k].ic)}<b>${i+1}</b></i></div>`});
  tr.innerHTML=h;shown=st.length}

/* ---------- blocks and code ---------- */
function drawPalette(){const p=$('palette');p.innerHTML='';
  ['U','D','L','R','J'].forEach(k=>{if(!lv.b.includes(k))return;const B=BLOCKS[k];const wrap=document.createElement('div');wrap.className='pal';
    const b=document.createElement('button');b.type='button';b.className='blk '+k;b.id='blk-'+k;b.setAttribute('aria-label',B.en);b.innerHTML=icon(B.ic);
    b.onclick=()=>addBlock(k);wrap.appendChild(b);wrap.insertAdjacentHTML('beforeend',`<span class="lab">${B.en}<br>${B.hi}</span>`);p.appendChild(wrap)})}
const maxSlots=()=>Math.min(24,Math.max(8,lv.opt+4));
function drawSlots(run=-1,bad=-1){const s=$('slots');s.innerHTML='';
  for(let i=0;i<maxSlots();i++){const k=prog[i],b=document.createElement('button');b.type='button';b.id='slot-'+i;
    b.className='slot'+(k?' f '+k:'')+(i===run?' run':'')+(i===bad?' bad':'');
    if(k){b.innerHTML=icon(BLOCKS[k].ic);b.setAttribute('aria-label','Remove '+BLOCKS[k].en);b.onclick=()=>{if(running)return;prog.splice(i,1);shown=Math.min(shown,i);SFX.unpop();drawSlots();resetHero()}}
    else{b.setAttribute('aria-label','Empty box');b.disabled=true}
    s.appendChild(b)}
  if(!running)preview();
  $('codeLbl').textContent=`Your code · तुम्हारा कोड (${prog.length}/${maxSlots()})`}
function addBlock(k){if(running)return;if(prog.length>=maxSlots()){msg('The code boxes are full · डिब्बे भर गए');SFX.bonk();return}
  prog.push(k);SFX.pop();say(BLOCKS[k].say,BLOCKS[k].hi);drawSlots();resetHero()}
function resetHero(){if(pos&&(pos[0]!==start[0]||pos[1]!==start[1])||got.size){got=new Set();drawBoard()}}

/* ---------- run the code ---------- */
async function run(){
  if(running){stopReq=true;return}
  if(!prog.length){msg('Add some blocks first · पहले ब्लॉक जोड़ो');SFX.bonk();return}
  got=new Set();drawBoard();await sleep(250);
  running=true;stopReq=false;hero.classList.add('walk');$('playBtn').innerHTML=icon('stop')+'Stop';
  let p=[...start],f='R',result='short';
  for(let i=0;i<prog.length;i++){
    if(stopReq){result='stopped';break}
    const k=prog[i];drawSlots(i);say(BLOCKS[k].say,BLOCKS[k].hi);
    let np,mid=null;
    if(k==='J'){const d=DIRS[f];mid=[p[0]+d[0],p[1]+d[1]];np=[p[0]+2*d[0],p[1]+2*d[1]]}
    else{const d=DIRS[k];f=k;np=[p[0]+d[0],p[1]+d[1]]}
    const dest=at(np[0],np[1]),midc=mid?at(mid[0],mid[1]):null;
    if(k==='J'&&midc==='#'||dest==='#'){ // bump into a tree or the edge
      hero.classList.toggle('left',f==='L');hero.classList.remove('bump');void hero.offsetWidth;hero.classList.add('bump');SFX.bonk();drawSlots(-1,i);result='bump';await sleep(500);break}
    if(k==='J'){hero.classList.remove('hop');void hero.offsetWidth;hero.classList.add('hop');SFX.jump()}else SFX.step();
    place(np,f);p=np;await sleep(k==='J'?480:420);hero.classList.remove('hop');const tk=$('tk-'+i);if(tk&&dest!=='W')tk.classList.add('done');
    if(dest==='W'){hero.classList.add('sink');SFX.splash();drawSlots(-1,i);result='splash';await sleep(700);break}
    const key=p[0]+','+p[1];
    if(dest==='*'&&!got.has(key)){got.add(key);SFX.star();const s=cellAt(p).querySelector('.star');if(s)s.classList.add('gone');updGot()}
    if(dest==='G'){result='win';break}
  }
  running=false;hero.classList.remove('walk');$('playBtn').innerHTML=icon('play_arrow')+'Play';drawSlots();
  if(result==='win')return win();
  if(result==='bump'){msg('Bonk! A tree is in the way. Mistakes help us learn, try again · फिर से कोशिश करो');say('Oops! Try again','अरे! फिर से कोशिश करो')}
  else if(result==='splash'){msg('Splash! Use the purple Jump block to hop over water · पानी पर कूदो');say('Splash! Try jumping','छपाक! कूद कर देखो')}
  else if(result==='short'){msg(`Almost there! Add more blocks to reach the ${GOALS[lv.g].e} · और ब्लॉक जोड़ो`);SFX.oops();say('Almost there!','बस थोड़ा और!')}
  else msg('Stopped · रुक गए');
  if(result!=='stopped')setTimeout(()=>{if(!running){got=new Set();drawBoard()}},1400)}
function cellAt(p){return $('board').querySelector(`.cell[data-x="${p[0]}"][data-y="${p[1]}"]`)}
function win(){
  const g=GOALS[lv.g];cellAt(pos).querySelector('.gl')?.classList.add('gone');
  hero.classList.add('party');({icecream:SFX.nom,pizza:SFX.nom,cake:SFX.nom,gold:SFX.coin,ship:SFX.horn,home:SFX.fanfare}[lv.g]||SFX.fanfare)();
  setTimeout(SFX.fanfare,700);say(g.win,g.winHi);
  const total=lv.m.join('').split('*').length-1,stars=total?1+Math.round(2*got.size/total):3;
  best[L]=Math.max(best[L]||0,stars);store();
  setTimeout(()=>{$('winE').textContent=g.e+mon;$('winT').textContent=g.win+' · '+g.winHi;
    $('winStars').innerHTML=[0,1,2].map(i=>icon('star',i<stars?'on':'')).join('');
    $('winP').textContent=`You used ${prog.length} blocks and collected ${got.size} of ${total} stars.`+(prog.length>lv.opt?` Can you do it with ${lv.opt} blocks?`:'');
    $('againBtn').innerHTML=icon('replay')+'Play again';$('againBtn').onclick=()=>load(L);
    const last=L>=LEVELS.length-1;$('nextBtn').innerHTML=icon(last?'grid_view':'arrow_forward')+(last?'All levels':'Next level');$('nextBtn').onclick=()=>last?openLevels():load(L+1);
    $('winScreen').hidden=false},1500)}

/* ---------- screens ---------- */
function openLevels(){const box=$('levels');box.innerHTML='';
  LEVELS.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='lv';b.id='lv-'+i;
    b.innerHTML=`<span class="e">${GOALS[v.g].e}</span><b>${i+1}. ${v.n}</b><small>${[...v.b].map(k=>BLOCKS[k].en).join(' · ')}</small><span class="st">${[0,1,2].map(s=>icon('star',s<(best[i]||0)?'on':'')).join('')}</span>`;
    b.onclick=()=>load(i);box.appendChild(b)});
  ['winScreen','monScreen'].forEach(s=>$(s).hidden=true);$('levelScreen').hidden=false}
function openMonsters(){const box=$('mons');box.innerHTML='';
  MONSTERS.forEach((m,i)=>{const b=document.createElement('button');b.type='button';b.id='mon-'+i;b.textContent=m;b.setAttribute('aria-pressed',m===mon);
    b.onclick=()=>{mon=m;store();SFX.jump();openMonsters();paintTop()};box.appendChild(b)});
  $('monDone').innerHTML=icon('check')+'Let\'s go';$('monDone').onclick=()=>{$('monScreen').hidden=true;if(lv)load(L)};
  $('monScreen').hidden=false}
function paintTop(){
  $('brand').innerHTML='<span class="badge">'+icon('code')+'</span>Grow Gently Code <small>· कोडिंग खेल</small>';
  $('levelsBtn').innerHTML=icon('grid_view')+'Levels';$('monBtn').textContent=mon;
  $('voiceBtn').innerHTML=icon('record_voice_over')+`<span>${voice==='hi'?'हिंदी':'English'}</span>`}
$('levelsBtn').onclick=()=>{if(!running)openLevels()};
$('monBtn').onclick=()=>{if(!running)openMonsters()};
$('voiceBtn').onclick=()=>{voice=voice==='hi'?'en':'hi';store();paintTop();say('Hello!','नमस्ते!')};
$('playBtn').innerHTML=icon('play_arrow')+'Play';$('playBtn').onclick=run;
$('undoBtn').innerHTML=icon('backspace');$('undoBtn').onclick=()=>{if(running||!prog.length)return;prog.pop();shown=prog.length;SFX.unpop();drawSlots();resetHero()};
$('clearBtn').innerHTML=icon('delete');$('clearBtn').onclick=()=>{if(running)return;prog=[];shown=0;SFX.unpop();drawSlots();resetHero();msg('Cleared · साफ़')};

const SHARE_URL='https://visualschedulesofficial-gif.github.io/growgently-play-/code/';
/* ---------- full screen + share (helps when the app sits inside a website page) ---------- */
(()=>{
  const fsBtn=document.getElementById('fsBtn'),shareBtn=document.getElementById('shareBtn');
  const inFrame=(()=>{try{return window.self!==window.top}catch(_){return true}})();
  const de=document.documentElement,canFS=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const paint=()=>{fsBtn.innerHTML=icon(isFS()?'fullscreen_exit':canFS?'fullscreen':'open_in_new')+`<span>${isFS()?'Exit full screen':canFS?'Full screen':'Open full screen'}</span>`};
  if(!canFS&&!inFrame)fsBtn.hidden=true;
  paint();document.addEventListener('fullscreenchange',paint);document.addEventListener('webkitfullscreenchange',paint);
  fsBtn.onclick=async()=>{
    if(isFS()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(_){}return}
    if(canFS){try{await (de.requestFullscreen||de.webkitRequestFullscreen).call(de);return}catch(_){}}
    window.open(location.href.split('#')[0],'_blank','noopener')};
  shareBtn.innerHTML=icon('share')+'<span>Share</span>';
  shareBtn.onclick=async()=>{
    const data={title:document.title,text:'Free for kids, from Grow Gently',url:SHARE_URL};
    if(navigator.share){try{await navigator.share(data);return}catch(e){if(e&&e.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(SHARE_URL);toast('Link copied · लिंक कॉपी हो गया')}catch(_){toast(SHARE_URL,7000)}};
})();

paintTop();load(0);openLevels();
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fit,120)});
document.fonts&&document.fonts.ready.then(fit);
})();
</script>

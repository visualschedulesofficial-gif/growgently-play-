<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="description" content="Free bilingual Hindi-English drawing and colouring app for kids by Grow Gently.">
<title>Grow Gently Paint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Playwrite+DE+Grund:wght@100..400&display=swap">
<style>
/* Layout: art-room table. Full-height tool bar on the left (Save pinned to its foot), paper in the middle,
   brush options on the right, paint tray centred under the paper. On phones everything stacks. */
:root{
  --bg:#e6efea;        /* soft leaf-grey wall */
  --panel:#ffffff;
  --ink:#1e3b33;
  --muted:#566b62;
  --line:#cde0d6;
  --btn:#eef5f1;
  --accent:#2e7d62;    /* Grow Gently green: the tool in your hand */
  --accent-ink:#ffffff;
  --save:#ffc61a;      /* school-bus yellow: keep your picture */
  --save-ink:#1e3b33;
  --font:"Playwrite DE Grund","Kalam","Noto Sans Devanagari",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a16;--panel:#17241f;--ink:#ecf4ef;--muted:#9db3a9;--line:#2b3e35;--btn:#20302a;--accent:#5cc29c;--accent-ink:#0b1a14;--save:#ffd23f;--save-ink:#1e3b33;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a16;--panel:#17241f;--ink:#ecf4ef;--muted:#9db3a9;--line:#2b3e35;--btn:#20302a;--accent:#5cc29c;--accent-ink:#0b1a14;--save:#ffd23f;--save-ink:#1e3b33;color-scheme:dark}

[hidden]{display:none!important}
/* Playwrite DE Grund (English handwriting) has no bold and no Hindi letters: never fake-bold it, let Hindi fall to Kalam, give matras room */
body{font-synthesis:none;line-height:1.45}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
svg.i{width:28px;height:28px;fill:currentColor;display:block;flex:none}

.app{height:100%;box-sizing:border-box;padding-block:10px;padding-inline:16px;display:grid;gap:10px;
  grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"tools canvas opts" "tools bottom bottom"}

/* left tool bar */
#tools{grid-area:tools;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:8px;overflow-y:auto;min-height:0}
.tgrid{display:grid;grid-template-columns:repeat(2,74px);gap:6px}
.sep{height:2px;background:var(--line);border-radius:2px;margin:2px 4px;flex:none}
.btn{appearance:none;border:0;background:var(--btn);color:var(--ink);border-radius:14px;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:64px;padding:5px 2px;line-height:1.05;touch-action:manipulation}
.btn .en{font-size:13px;font-weight:700}
.btn .hi{font-size:11px;color:var(--muted);font-weight:500}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"] .hi{color:var(--accent-ink);opacity:.85}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.sw:focus-visible,.size:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.save{margin-top:auto;flex:none;appearance:none;border:0;cursor:pointer;font-family:inherit;background:var(--save);color:var(--save-ink);
  border-radius:16px;min-height:62px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.save b{font-size:20px;font-weight:800;line-height:1}
.save span{font-size:14px;font-weight:700;line-height:1}
.save:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}

/* paper */
.stage{grid-area:canvas;position:relative;min-width:0;min-height:0;border-radius:18px;overflow:hidden;background:#fff;border:3px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--panel);font-weight:700;
  font-size:15px;padding:8px 16px;border-radius:999px;pointer-events:none;max-width:calc(100% - 24px);text-align:center}
.guessfab{position:absolute;right:12px;bottom:12px;appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);
  font-family:inherit;border-radius:999px;padding:6px 14px 6px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.guessfab svg.i{width:26px;height:26px;fill:#f2b200}
.guessfab b{font-size:15px;line-height:1.05}.guessfab small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.guessfab{z-index:3}
#objs{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.obj{position:absolute;pointer-events:auto;touch-action:none;cursor:grab}
.obj>svg{width:100%;height:100%;display:block;pointer-events:none}
.obj.sel{outline:3px dashed var(--accent);outline-offset:5px;border-radius:6px}
.obj .h{position:absolute;width:32px;height:32px;border-radius:50%;border:3px solid #fff;display:none;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25);touch-action:none;padding:0;cursor:pointer}
.obj.sel .h{display:grid}
.obj .h svg{width:18px;height:18px;fill:#fff;pointer-events:none}
.obj .del{right:-20px;top:-20px;background:#d6336c}
.obj .rs{right:-20px;bottom:-20px;background:var(--accent);cursor:nwse-resize}
.dragghost{position:fixed;pointer-events:none;z-index:30;opacity:.85;transform:translate(-50%,-50%)}
.dragghost svg{width:100%;height:100%;display:block}
#opts .opt.drag{touch-action:pan-y}
.opt.fix{grid-column:1/-1;flex-direction:row;gap:6px;background:var(--save);color:var(--save-ink);min-height:54px;border-color:transparent}
.opt.fix small{font-size:14px;line-height:1.1;text-align:left}
.preview{position:absolute;inset:12px;display:grid;place-items:center;pointer-events:none}
.preview svg{height:100%;max-height:560px;width:auto;max-width:100%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.12))}

/* right options */
#opts{grid-area:opts;display:grid;grid-template-columns:repeat(2,60px);gap:6px;align-content:start;background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:8px;overflow-y:auto;min-height:0}
.lbl{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1;padding-top:2px}
.opt,.size{appearance:none;border:2px solid transparent;background:var(--btn);color:var(--ink);border-radius:14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;min-height:56px;padding:4px}
.opt small{font-size:11px;font-weight:700;line-height:1}
.opt[aria-pressed="true"],.size[aria-pressed="true"]{border-color:var(--accent);background:var(--panel)}
.size i{display:block;border-radius:50%;background:var(--ink)}
.opt.wide{grid-column:1/-1;flex-direction:row;gap:6px;background:var(--accent);color:var(--accent-ink);min-height:52px}
.opt.wide small{font-size:13px}
.opt svg.i{width:30px;height:30px}
.opt.person svg{width:30px;height:56px}
.opt.eye svg{width:46px;height:30px}
.opt.shp{gap:1px;padding:5px 2px}
.opt.shp svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.opt.shp small{font-size:11px;line-height:1.1}
.opt.shp small.h{font-weight:400;color:var(--muted)}

/* bottom tray */
#bottom{--sw:clamp(34px,calc((100vw - 470px) / 19),46px);grid-area:bottom;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 10px;min-width:0;overflow:hidden}
.scroller{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tray{display:flex;gap:8px;align-items:center;width:max-content;margin:0 auto;padding:2px 4px}
.sw{flex:none;width:var(--sw);height:var(--sw);border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.sw[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.14)}
.custom{flex:none;position:relative;width:var(--sw);height:var(--sw);border-radius:50%;border:3px solid var(--line);overflow:hidden;
  background:conic-gradient(#e53935,#ff8a00,#ffd600,#5bd15b,#00bcd4,#1e63e9,#9c6ade,#e53935)}
.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* person builder (replaces the colour tray) */
.bhead{display:flex;gap:8px;align-items:center;width:max-content;margin:0 auto 8px}
.btab{appearance:none;border:2px solid var(--line);background:var(--btn);color:var(--ink);font-family:inherit;border-radius:12px;
  padding:4px 10px;display:flex;align-items:center;gap:6px;cursor:pointer}
.btab svg.i{width:22px;height:22px}
.btab b{font-size:14px;line-height:1.1}.btab i{font-style:normal;font-size:12px;color:var(--muted)}
.btab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btab[aria-pressed="true"] i{color:var(--accent-ink)}
.done{appearance:none;border:0;font-family:inherit;font-weight:800;font-size:16px;border-radius:12px;padding:8px 16px;cursor:pointer;
  background:var(--save);color:var(--save-ink);display:flex;align-items:center;gap:4px}
.cancel{appearance:none;border:0;font-family:inherit;font-weight:700;font-size:14px;border-radius:12px;padding:8px 12px;cursor:pointer;background:var(--btn);color:var(--ink)}
.ptile{flex:none;appearance:none;border:2px solid var(--line);background:#fff;color:#1e3b33;border-radius:14px;padding:4px 6px;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;width:84px}
.ptile svg{width:44px;height:88px}
.ptile b{font-size:12px;line-height:1.1;text-align:center}
.ptile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

/* dialogs */
.overlay{position:fixed;inset:0;background:rgba(10,20,26,.66);display:grid;place-items:center;padding:16px;z-index:5}
.card{background:var(--panel);color:var(--ink);border-radius:20px;padding:18px;max-width:min(720px,100%);display:grid;gap:12px;text-align:center;box-sizing:border-box}
.card p{margin:0;font-size:16px;line-height:1.4}
.card .hi{color:var(--muted)}
.card .big{font-size:22px;font-weight:700;line-height:1.3}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pbtn{appearance:none;border:0;font-family:inherit;font-weight:700;font-size:16px;border-radius:12px;padding:10px 18px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px}
.pbtn.ghost{background:var(--btn);color:var(--ink)}
.pbtn svg.i{width:22px;height:22px}
.card img.saveimg{border-radius:12px;border:1px solid var(--line);max-height:58vh;max-width:100%;margin:0 auto;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.picker{width:min(980px,100%);height:calc(100% - 8px);grid-template-rows:auto auto minmax(0,1fr) auto;text-align:left}
.finder{grid-template-rows:auto auto minmax(0,1fr) auto auto}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.phead p{font-weight:700;font-size:18px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;display:flex;align-items:center;gap:8px;font-family:inherit;border:2px solid var(--line);background:var(--btn);color:var(--ink);
  border-radius:14px;padding:6px 12px;cursor:pointer;text-align:left}
.tab span{display:grid;line-height:1.1}.tab b{font-size:14px}.tab i{font-style:normal;font-size:12px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-pressed="true"] i{color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;overflow-y:auto;padding:2px;align-content:start}
.pic{font-family:inherit;display:grid;gap:2px;justify-items:center;border:2px solid var(--line);background:#fff;color:#1e3b33;border-radius:14px;padding:8px;cursor:pointer}
.pic img{width:100%;aspect-ratio:4/3;object-fit:contain}
.pic b{font-size:14px;line-height:1.1;text-align:center}.pic i{font-style:normal;font-size:12px;color:#566b62;text-align:center}
.pic:active{border-color:var(--accent)}
.credit{font-size:12px!important;color:var(--muted)}
.credit a,.linkbtn{color:inherit}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:inherit;font-size:15px;font-weight:600;border:2px solid var(--line);background:var(--btn);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.search{width:100%;box-sizing:border-box;font-family:inherit;font-size:18px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
#aiMsg:empty,#gAlt:empty{display:none}

/* phones and short screens: stack everything */
@media (max-width:760px),(max-height:560px) and (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"tools" "canvas" "opts" "bottom";gap:8px;padding-block:8px}
  #tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px;border-radius:16px}
  .tgrid{display:flex;gap:6px}
  .tgrid .btn{flex:0 0 64px;min-height:58px}
  .sep{width:2px;height:auto;margin:4px 2px}
  .save{margin-top:0;margin-left:auto;min-width:96px}
  #opts{display:flex;overflow-x:auto;overflow-y:hidden;padding:6px;border-radius:16px}
  #opts>*{flex:0 0 56px}
  #opts .opt.wide,#opts .opt.fix{flex:0 0 auto;padding:4px 12px}
  #opts .opt.drag{touch-action:pan-x}
  .lbl{display:none}
  #bottom{--sw:40px}
  #bottom{padding:6px}
}
@media (prefers-reduced-motion:reduce){.btn:active,.save:active{transform:none}.sw[aria-pressed="true"]{transform:none}}
</style>
</head>
<body>

<div class="app">
  <nav id="tools" aria-label="Tools">
    <div class="tgrid" id="toolGrid"></div>
    <div class="sep"></div>
    <div class="tgrid" id="actGrid"></div>
    <button type="button" class="save" id="saveBtn" aria-label="Save picture"></button>
  </nav>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Drawing paper"></canvas>
    <div id="objs" aria-label="Stamps you can still move"></div>
    <div class="preview" id="preview" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <button type="button" class="guessfab" id="guessFab" aria-label="Guess my drawing"></button>
  </div>
  <aside id="opts" aria-label="Brush options"></aside>
  <div id="bottom">
    <div class="scroller" id="colorsWrap"><div class="tray" id="colors" aria-label="Colours"></div></div>
    <div id="builder" hidden>
      <div class="scroller"><div class="bhead" id="btabs"></div></div>
      <div class="scroller"><div class="tray" id="bopts"></div></div>
    </div>
  </div>
</div>

<div class="overlay" id="saveBox" hidden>
  <div class="card">
    <img id="saveImg" class="saveimg" alt="Your picture">
    <p><strong>Press and hold the picture</strong>, then tap <strong>Save to Photos</strong>.</p>
    <p class="hi">चित्र को दबाकर रखें, फिर "Save to Photos" दबाएँ।</p>
    <div class="row"><button type="button" class="pbtn" id="saveClose">Done · ठीक है</button></div>
  </div>
</div>

<div class="overlay" id="pickBox" hidden>
  <div class="card picker">
    <div class="phead"><p>Choose a picture · चित्र चुनो</p><button type="button" class="pbtn ghost" id="pickClose">Close · बंद करो</button></div>
    <div class="tabs" id="pickTabs" role="group" aria-label="Themes"></div>
    <div class="grid" id="pickGrid"></div>
    <p class="credit"><button type="button" id="pickHouse" class="linkbtn">My house page</button> · Pictures include <a href="https://openmoji.org" target="_blank" rel="noopener">OpenMoji</a> art (CC BY-SA 4.0) · Icons: Material Symbols</p>
  </div>
</div>

<div class="overlay" id="aiBox" hidden>
  <div class="card picker finder">
    <div class="phead"><p>Find a picture · चित्र ढूँढो</p><button type="button" class="pbtn ghost" id="aiClose">Close · बंद करो</button></div>
    <form id="aiForm" style="display:grid;gap:10px">
      <input id="aiWhat" class="search" type="search" placeholder="Type: elephant, हाथी, bus, फूल…" autocomplete="off" enterkeyhint="search">
      <div class="chips" id="aiChips"></div>
    </form>
    <div class="grid" id="findGrid"></div>
    <p id="aiMsg" aria-live="polite"></p>
    <div class="row"><button type="button" class="pbtn ghost" id="askClaude" hidden></button><button type="button" class="pbtn ghost" id="aiStop" hidden>Stop · रुको</button></div>
  </div>
</div>

<div class="overlay" id="guessBox" hidden>
  <div class="card">
    <p class="big" id="gEn" aria-live="polite"></p>
    <p class="big hi" id="gHi"></p>
    <p class="hi" id="gAlt"></p>
    <div class="row">
      <button type="button" class="pbtn ghost" id="sayEn"></button>
      <button type="button" class="pbtn ghost" id="sayHi"></button>
      <button type="button" class="pbtn" id="gClose">Done · ठीक है</button>
    </div>
  </div>

function resize(){

  let old=null;if(W&&H){old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;old.getContext('2d').drawImage(cv,0,0)}
  W=nw;H=nh;cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  if(old)ctx.drawImage(old,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineCap='round';ctx.lineJoin='round';
  undo=[];redo=[];
}
const snap=()=>ctx.getImageData(0,0,cv.width,cv.height);
function pushUndo(){undo.push(snap());if(undo.length>MAXU)undo.shift();redo=[]}
function clearWhite(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.restore()}

function colorPage(){
  clearWhite();ctx.save();ctx.strokeStyle='#111';ctx.lineWidth=Math.max(5,Math.min(W,H)/95);ctx.fillStyle='#fff';ctx.lineCap='round';ctx.lineJoin='round';
  const u=Math.min(W/10,H/7);const gy=H*0.78;
  ctx.beginPath();ctx.moveTo(-10,gy);ctx.bezierCurveTo(W*.3,gy-u*.4,W*.6,gy+u*.3,W+10,gy-u*.2);ctx.stroke();
  const sx=W*.14,sy=H*.18,sr=u*.6;ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();ctx.stroke();
  for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(sx+Math.cos(a)*sr*1.3,sy+Math.sin(a)*sr*1.3);ctx.lineTo(sx+Math.cos(a)*sr*1.8,sy+Math.sin(a)*sr*1.8);ctx.stroke()}
  const cx=W*.62,cy=H*.16;ctx.beginPath();ctx.arc(cx,cy,u*.4,Math.PI*.9,Math.PI*1.9);ctx.arc(cx+u*.55,cy-u*.1,u*.5,Math.PI*1.1,Math.PI*1.95);
  ctx.arc(cx+u*1.1,cy+u*.05,u*.38,Math.PI*1.3,Math.PI*.4);ctx.lineTo(cx-u*.35,cy+u*.3);ctx.closePath();ctx.fill();ctx.stroke();
  const hx=W*.3,hw=u*2.4,hh=u*1.8,hy=gy-hh+u*.05;
  ctx.beginPath();ctx.rect(hx,hy,hw,hh);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(hx-u*.3,hy);ctx.lineTo(hx+hw/2,hy-u*1.3);ctx.lineTo(hx+hw+u*.3,hy);ctx.closePath();ctx.fill();ctx.stroke();
  [[hx+hw*.4,hy+hh*.45,hw*.22,hh*.55],[hx+hw*.1,hy+hh*.2,hw*.2,hh*.22],[hx+hw*.7,hy+hh*.2,hw*.2,hh*.22]].forEach(r=>{ctx.beginPath();ctx.rect(...r);ctx.fill();ctx.stroke()});
  const tx=W*.78,tw=u*.4,th=u*1.4;ctx.beginPath();ctx.rect(tx-tw/2,gy-th,tw,th);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(tx,gy-th-u*.55,u*.85,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.restore();
}

/* flood fill */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function flood(x,y,hex){
  const w=cv.width,h=cv.height,px=Math.floor(x*DPR),py=Math.floor(y*DPR);if(px<0||py<0||px>=w||py>=h)return;
  const img=ctx.getImageData(0,0,w,h),d=img.data,[r,g,b]=hex2rgb(hex);
  const s=(py*w+px)*4,tr=d[s],tg=d[s+1],tb=d[s+2];
  if(Math.abs(tr-r)+Math.abs(tg-g)+Math.abs(tb-b)<6)return;
  const seen=new Uint8Array(w*h),TOL=110;
  const ok=p=>{if(seen[p])return false;const i=p*4;return Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tb)<=TOL};
  const set=p=>{seen[p]=1;const i=p*4;d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255};
  const stack=[px,py];
  while(stack.length){let cy=stack.pop(),cx=stack.pop();let p=cy*w+cx;
    while(cx>=0&&ok(p)){cx--;p--}cx++;p++;let up=false,dn=false;
    while(cx<w&&ok(p)){set(p);
      if(cy>0){if(ok(p-w)){if(!up){stack.push(cx,cy-1);up=true}}else up=false}
      if(cy<h-1){if(ok(p+w)){if(!dn){stack.push(cx,cy+1);dn=true}}else dn=false}
      cx++;p++}}
  const grow=[];for(let p=0;p<w*h;p++){if(seen[p])continue;const i=p*4;if(d[i]+d[i+1]+d[i+2]<120)continue;
    if((p%w>0&&seen[p-1])||(p%w<w-1&&seen[p+1])||(p>=w&&seen[p-w])||(p<w*h-w&&seen[p+w]))grow.push(p)}
  grow.forEach(p=>{const i=p*4;const a=(d[i]+d[i+1]+d[i+2])/765;d[i]=d[i]*(1-a)+r*a;d[i+1]=d[i+1]*(1-a)+g*a;d[i+2]=d[i+2]*(1-a)+b*a});
  ctx.putImageData(img,0,0);
}

/* ---------- brushes ---------- */
let crayonPat=null;
function crayonPattern(col){
  if(crayonPat&&crayonPat.col===col)return crayonPat.p;
  const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.fillStyle=col;x.fillRect(0,0,48,48);
  const im=x.getImageData(0,0,48,48);for(let i=3;i<im.data.length;i+=4){const r=Math.random();im.data[i]=r<.22?0:r<.4?120:255}
  x.putImageData(im,0,0);const p=ctx.createPattern(c,'repeat');crayonPat={col,p};return p}
const inkColor=()=>st.tool==='eraser'?'#ffffff':st.tool==='rainbow'?`hsl(${st.hue},90%,55%)`:st.color;
const brushKind=()=>st.tool==='eraser'?'marker':st.brush;
let S=null; // current stroke
function newStroke(p,e){
  const n=Math.max(7,Math.min(26,Math.round(st.size*.9)));const bristles=[];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*st.size*.5;
    bristles.push({dx:Math.cos(a)*r,dy:Math.sin(a)*r,w:st.size*(.1+Math.random()*.14)+.6,al:.35+Math.random()*.5})}
  return {last:p,mid:p,t:e.timeStamp,f:.6,bristles}}
function pressureF(e,s){if(e.pointerType==='pen'&&e.pressure>0)return .35+e.pressure*1.15;
  const sp=Math.min(4,Math.hypot(s.dx,s.dy)/Math.max(1,s.dt));return Math.max(.5,Math.min(1.25,1.25-sp*.28))}
function seg(a,b,fa,fb,mirror){
  const k=brushKind(),col=inkColor(),size=st.tool==='eraser'?st.size*1.6:st.size;
  if(k==='marker'){ctx.strokeStyle=col;ctx.lineWidth=size*(fa+fb)/2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();return}
  if(k==='crayon'){ctx.strokeStyle=crayonPattern(col);ctx.lineWidth=size*1.1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();return}
  // paint brush: a soft core plus bristle streaks that thin out when the hand moves fast
  ctx.strokeStyle=col;ctx.globalAlpha=.9;ctx.lineWidth=size*.55*(fa+fb)/2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  for(const br of S.bristles){const dx=mirror?-br.dx:br.dx;ctx.globalAlpha=br.al;ctx.lineWidth=br.w*fb;ctx.beginPath();
    ctx.moveTo(a.x+dx*fa,a.y+br.dy*fa);ctx.lineTo(b.x+dx*fb,b.y+br.dy*fb);ctx.stroke()}
  ctx.globalAlpha=1}
function strokeTo(p,e){
  const dt=e.timeStamp-S.t;const f=S.f*.65+pressureF(e,{dx:p.x-S.last.x,dy:p.y-S.last.y,dt})*.35;
  const a=S.last,m={x:(a.x+p.x)/2,y:(a.y+p.y)/2};
  // smooth: draw from previous midpoint to this midpoint through the last point
  const pts=[];for(let i=1;i<=4;i++){const t=i/4,u=1-t;pts.push({x:u*u*S.mid.x+2*u*t*a.x+t*t*m.x,y:u*u*S.mid.y+2*u*t*a.y+t*t*m.y})}
  let prev=S.mid,pf=S.f;
  pts.forEach((q,i)=>{const qf=S.f+(f-S.f)*(i+1)/4;seg(prev,q,pf,qf,false);
    if(st.tool==='mirror')seg({x:W-prev.x,y:prev.y},{x:W-q.x,y:q.y},pf,qf,true);prev=q;pf=qf});
  S.last=p;S.mid=m;S.f=f;S.t=e.timeStamp;if(st.tool==='rainbow')st.hue=(st.hue+4)%360}
function dot(p){const k=brushKind();seg(p,{x:p.x+.01,y:p.y},.8,.8,false);if(st.tool==='mirror')seg({x:W-p.x,y:p.y},{x:W-p.x-.01,y:p.y},.8,.8,true)}
function spray(p){ctx.fillStyle=st.color;const R=st.size*1.7,n=Math.round(st.size*1.6);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*R;ctx.fillRect(p.x+Math.cos(a)*rr,p.y+Math.sin(a)*rr,1.7,1.7)}}
function shape(a,b){
  ctx.strokeStyle=st.color;ctx.lineWidth=Math.max(5,st.size);ctx.lineJoin='round';ctx.beginPath();
  const dx=b.x-a.x,dy=b.y-a.y,k=st.shape;
  // circle, square and star stay even: the bigger side of the drag decides their size
  const s=Math.max(Math.abs(dx),Math.abs(dy)),ex=a.x+Math.sign(dx||1)*s,ey=a.y+Math.sign(dy||1)*s;
  const box=['circle','square','star'].includes(k)?{x:Math.min(a.x,ex),y:Math.min(a.y,ey),w:s,h:s}:{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(dx),h:Math.abs(dy)};
  const {x,y,w,h}=box,cx=x+w/2,cy=y+h/2;
  if(k==='line'){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}
  else if(k==='square'||k==='rectangle'){ctx.rect(x,y,w,h)}
  else if(k==='circle'||k==='oval'){ctx.ellipse(cx,cy,w/2,h/2,0,0,Math.PI*2)}
  else if(k==='triangle'){ctx.moveTo(cx,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath()}
  else if(k==='half'){ctx.ellipse(cx,y+h,w/2,h,0,Math.PI,Math.PI*2);ctx.closePath()}
  else if(k==='star'){const R=s/2,r=R*.45;for(let i=0;i<10;i++){const ang=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;
    const px=cx+rr*Math.cos(ang),py=cy+rr*Math.sin(ang);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
  ctx.stroke()}
const iconPaths={};
/* stamps land as movable pieces first; "Fix on paper" (or picking another tool) paints them in */
const objsEl=$('objs');let objs=[],selObj=null,hinted=false;
function svgFor(key){

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="${ICONS[key]}" fill="${st.color}"/></svg>`}
function sizeFor(key){

  if(key.startsWith('eye:')){const k=key.slice(4),[,,vw,vh]=EYES[k].vb.split(' ').map(Number);
    const h=STAMP_PX[st.stampSize]*f*({eyes:.8,mouth:.7,nose:.55,horns:.9}[EYES[k].sec||'eyes'])*(vw>vh?1:1.3);return{w:h*vw/vh,h}}

    for(const o of list){try{const im=await imgOf(o.svg.replace('<svg',`<svg width="${Math.round(o.w*DPR)}" height="${Math.round(o.h*DPR)}"`));
      ctx.drawImage(im,o.x-o.w/2,o.y-o.h/2,o.w,o.h)}catch(_){} o.el.remove()}

      ev.preventDefault();ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'};
    const up=ev=>{if(ev.pointerId!==id)return;window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      if(!ghost)return;ghost.remove();btn.dataset.dragged='1';setTimeout(()=>delete btn.dataset.dragged,0);
      const r=cv.getBoundingClientRect();
      if(ev.type==='pointerup'&&ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){st.stamp=key;addObj(key,{x:ev.clientX-r.left,y:ev.clientY-r.top})}
      renderOpts()};
    window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)});
  btn.addEventListener('click',e=>{if(btn.dataset.dragged){e.stopImmediatePropagation();e.preventDefault()}},true)}

let drawing=false,start=null,base=null,pid=null;
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{
  if(pid!==null||builderOpen)return;e.preventDefault();pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(_){}
  const p=pos(e);
  if(st.tool==='stamp'){addObj(st.stamp,p);pid=null;return}
  pushUndo();
  if(st.tool==='fill'){flood(p.x,p.y,st.color);pid=null;return}
  drawing=true;start=p;
  if(st.tool==='shape'){base=snap();return}
  if(st.tool==='spray'){spray(p);S={last:p};return}
  S=newStroke(p,e);dot(p);
});
cv.addEventListener('pointermove',e=>{
  if(!drawing||e.pointerId!==pid)return;e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
  for(const ev of (evs.length?evs:[e])){const p=pos(ev);
    if(base){ctx.putImageData(base,0,0);shape(start,p)}
    else if(st.tool==='spray')spray(p);
    else if(Math.hypot(p.x-S.last.x,p.y-S.last.y)>1.2)strokeTo(p,ev)}
});
const end=e=>{if(e.pointerId!==pid)return;
  if(base&&st.tool==='shape'){const p=pos(e);if(Math.hypot(p.x-start.x,p.y-start.y)>10){const v=SHAPES[st.shape];toast(`${v.en} · ${v.hi}`,1800)}}
  drawing=false;base=null;pid=null;S=null};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

/* ---------- actions ---------- */
let downloads=null;
async function save(){await bake();
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(downloads){try{await downloads.save({filename:'my-drawing.png',data:blob});toast('Saved · सेव हो गया');return}
    catch(e){if(e&&e.code==='declined')return;if(!['unavailable','not_granted','capability_disabled','capability_removed'].includes(e?.code)){toast('Could not save. Try again. · फिर से दबाओ');return}downloads=null}}
  $('saveImg').src=cv.toDataURL('image/png');$('saveBox').hidden=false}
function doAction(id){
  if(id==='undo'&&objs.length){removeObj(objs[objs.length-1])}
  else if(id==='undo'&&undo.length){redo.push(snap());ctx.putImageData(undo.pop(),0,0)}
  else if(id==='redo'&&redo.length){undo.push(snap());ctx.putImageData(redo.pop(),0,0)}
  else if(id==='new'){dropObjs();pushUndo();clearWhite();if(st.tool==='stamp')renderOpts()}
  else if(id==='page')openPicker();
  else if(id==='find')openFind();
  else if(id==='guess')guess();
  else if(id==='char')openBuilder();
  else if(id==='save')save();
}
$('saveClose').onclick=()=>{$('saveBox').hidden=true};

/* ---------- person builder ---------- */
const PARTS=PERSON.parts,ORDER=['body','eyes','hair','dress','shoes'];
const TAB_IC={body:'accessibility_new',eyes:'visibility',hair:'face_3',dress:'checkroom',shoes:'steps'};
let sel={body:0,eyes:1,hair:2,dress:1,shoes:0},btab='body',builderOpen=false;
function composePerson(s){
  const o=k=>PARTS[k].opts[s[k]];const b=o('body'),e=o('eyes'),h=o('hair'),d=o('dress'),sh=o('shoes');
  return '<svg viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg"><g fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">'+
    [h.back,d.back,PERSON.legs,PERSON.feet,PERSON.torso,b.arms,d.dress,b.hands,sh.shoes,PERSON.head,h.front,e.face].filter(Boolean).join('')+'</g></svg>'}
function renderBuilder(){
  const tabs=$('btabs');tabs.innerHTML='';
  ORDER.forEach(k=>{const b=document.createElement('button');b.type='button';b.className='btab';b.id='bt-'+k;b.setAttribute('aria-pressed',k===btab);
    b.innerHTML=icon(TAB_IC[k])+`<span style="display:grid"><b>${PARTS[k].en}</b><i>${PARTS[k].hi}</i></span>`;b.onclick=()=>{btab=k;renderBuilder()};tabs.appendChild(b)});
  const done=document.createElement('button');done.type='button';done.className='done';done.id='bDone';done.innerHTML=icon('check')+'Done · हो गया';done.onclick=finishBuilder;
  const cancel=document.createElement('button');cancel.type='button';cancel.className='cancel';cancel.id='bCancel';cancel.textContent='Cancel · रहने दो';cancel.onclick=closeBuilder;
  tabs.prepend(done,cancel);
  const box=$('bopts');box.innerHTML='';
  PARTS[btab].opts.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='ptile';b.id=`po-${btab}-${i}`;
    b.setAttribute('aria-pressed',sel[btab]===i);b.innerHTML=composePerson({...sel,[btab]:i})+`<b>${o.en}</b><b style="font-weight:500">${o.hi}</b>`;
    b.onclick=()=>{sel[btab]=i;renderBuilder()};box.appendChild(b)});
  $('preview').innerHTML=composePerson(sel)}
function openBuilder(){builderOpen=true;$('guessFab').hidden=true;$('colorsWrap').hidden=true;$('builder').hidden=false;$('preview').hidden=false;renderBuilder()}
function closeBuilder(){builderOpen=false;$('guessFab').hidden=false;$('colorsWrap').hidden=false;$('builder').hidden=true;$('preview').hidden=true}
function finishBuilder(){
  personSVG=composePerson(sel);const img=new Image();
  img.onload=()=>{personImg=img;closeBuilder();st.stamp='person';st.stampSize=2;setTool('stamp');toast('Tap the paper to put your person · पन्ने पर दबाओ',3500)};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(personSVG.replace('<svg','<svg width="600" height="1200"'))}

/* ---------- picture library ---------- */
const pickBox=$('pickBox'),pickTabs=$('pickTabs'),pickGrid=$('pickGrid');
const svgURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
let curTheme='toys';try{curTheme=localStorage.getItem('gg-theme')||curTheme}catch(_){}
if(!PAGES[curTheme])curTheme='toys';
Object.entries(PAGES).forEach(([k,t])=>{const b=document.createElement('button');b.type='button';b.className='tab';b.id='tab-'+k;
  b.innerHTML=`${icon(t.ic)}<span><b>${t.en}</b><i>${t.hi}</i></span>`;b.onclick=()=>showTheme(k);pickTabs.appendChild(b)});
function showTheme(k){curTheme=k;try{localStorage.setItem('gg-theme',k)}catch(_){}
  Object.keys(PAGES).forEach(x=>$('tab-'+x).setAttribute('aria-pressed',x===k));
  pickGrid.innerHTML='';PAGES[k].items.forEach((it,i)=>{const b=document.createElement('button');b.type='button';b.className='pic';b.id='pic-'+k+'-'+i;
    b.innerHTML=`<img alt="" src="${svgURL(it.svg)}"><b>${it.en}</b><i>${it.hi}</i>`;b.onclick=()=>{pickBox.hidden=true;loadPage(it)};pickGrid.appendChild(b)})}
function openPicker(){showTheme(curTheme);pickBox.hidden=false}
$('pickClose').onclick=()=>{pickBox.hidden=true};
$('pickHouse').onclick=()=>{pushUndo();colorPage();setTool('fill');pickBox.hidden=true};
const imgOf=s=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=svgURL(s)});
async function loadPage(it){dropObjs();
  const label=it.hi?`${it.en} · ${it.hi}`:it.en,LH=Math.max(40,Math.min(56,H*0.08));
  const vb=(it.svg.match(/viewBox="([^"]+)"/)||[])[1]||'0 0 72 72';const [,,vw,vh]=vb.split(/\s+/).map(Number);
  let bw=W-24,bh=H-LH-16;const ar=vw/vh;if(bw/bh>ar)bw=bh*ar;else bh=bw/ar;
  const bx=(W-bw)/2,by=8+(H-LH-16-bh)/2;
  try{
    const im=await imgOf(it.svg.replace('<svg',`<svg width="${Math.round(bw*DPR)}" height="${Math.round(bh*DPR)}"`));
    pushUndo();clearWhite();ctx.drawImage(im,bx,by,bw,bh);
    try{await Promise.all([document.fonts.load(`400 24px "Playwrite DE Grund"`,label),document.fonts.load(`700 24px "Kalam"`,label)])}catch(_){}
    ctx.save();ctx.fillStyle='#1e3b33';ctx.font=`400 ${Math.round(LH*0.5)}px "Playwrite DE Grund","Kalam","Noto Sans Devanagari",cursive`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,W/2,H-LH/2-4);ctx.restore();
    setTool('fill');
  }catch(e){toast('That picture did not open. Try again. · फिर से दबाओ')}
}

/* ---------- find a picture (free, built in) + optional Claude ---------- */
let sample=null,busy=null,LIB=null,libP=null;const groupCache={};
const aiBox=$('aiBox'),aiMsg=$('aiMsg'),aiIn=$('aiWhat'),aiStop=$('aiStop'),findGrid=$('findGrid'),askBtn=$('askClaude');
['हाथी','dog','फूल','car','मछली','tree','cake','rocket','तितली','house','ball','सूरज'].forEach((t,i)=>{const b=document.createElement('button');
  b.type='button';b.id='idea-'+i;b.className='chip';b.textContent=t;b.onclick=()=>{aiIn.value=t;runSearch()};$('aiChips').appendChild(b)});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const loadLib=()=>libP||(libP=fetch('lib/index.json').then(r=>{if(!r.ok)throw new Error('lib');return r.json()}).then(j=>LIB=j).catch(e=>{libP=null;throw e}));
const getGroup=i=>groupCache[i]||(groupCache[i]=fetch(`lib/g${i}.json`).then(r=>{if(!r.ok)throw new Error('g');return r.json()}).catch(e=>{delete groupCache[i];throw e}));
function score(q,en,hi,tags){en=en.toLowerCase();
  if(en===q||hi===q)return 100;if(en.startsWith(q))return 70;if((' '+en).includes(' '+q))return 60;
  if(hi&&hi.includes(q))return 55;if(en.includes(q)&&q.length>2)return 35;if(tags&&(','+tags+',').includes(','+q))return 25;return 0}
function search(q){q=q.toLowerCase().trim();if(!q)return[];const out=[];
  for(const t of Object.values(PAGES))for(const it of t.items){const s=score(q,it.en,it.hi,'');if(s)out.push({s:s+5,en:it.en,hi:it.hi,page:it})}
  for(const r of LIB||[]){const s=score(q,r[2],r[3],r[4]);if(s)out.push({s,en:cap(r[2]),hi:r[3],row:r})}
  out.sort((a,b)=>b.s-a.s||a.en.length-b.en.length);return out.slice(0,30)}
async function runSearch(){
  const q=aiIn.value.trim();findGrid.innerHTML='';aiMsg.textContent='';
  askBtn.hidden=!(sample&&q);askBtn.textContent=`Ask Claude to draw “${q}” (uses your Claude account)`;
  if(!q)return;
  if(!LIB){aiMsg.textContent='Loading pictures… · चित्र आ रहे हैं…';try{await loadLib()}catch(_){aiMsg.textContent='Pictures could not load. Check the internet and try again. · इंटरनेट देखो।';return}aiMsg.textContent=''}
  if(q!==aiIn.value.trim())return;
  const res=search(q);
  if(!res.length){aiMsg.textContent='No picture found. Try another word. · कोई चित्र नहीं मिला, दूसरा शब्द लिखो।';return}
  res.forEach((r,i)=>{const b=document.createElement('button');b.type='button';b.className='pic';b.id='find-'+i;
    b.innerHTML='<img alt=""><b></b><i></i>';b.querySelector('b').textContent=r.en;b.querySelector('i').textContent=r.hi||'';const img=b.querySelector('img');
    if(r.page){img.src=svgURL(r.page.svg);b.onclick=()=>{aiBox.hidden=true;loadPage(r.page)}}
    else{getGroup(r.row[1]).then(g=>{if(g[r.row[0]])img.src=svgURL(g[r.row[0]])}).catch(()=>{});
      b.onclick=async()=>{try{const g=await getGroup(r.row[1]);aiBox.hidden=true;loadPage({en:r.en,hi:r.hi,svg:g[r.row[0]]})}
        catch(_){aiMsg.textContent='That picture could not load. Tap again. · फिर से दबाओ।'}}}
    findGrid.appendChild(b)})}
let st2;aiIn.addEventListener('input',()=>{clearTimeout(st2);st2=setTimeout(runSearch,250)});
$('aiForm').addEventListener('submit',e=>{e.preventDefault();aiIn.blur();runSearch()});
function openFind(){aiMsg.textContent='';aiStop.hidden=true;aiBox.hidden=false;loadLib().catch(()=>{});runSearch()}
$('aiClose').onclick=()=>{busy?.abort?.();aiBox.hidden=true};
aiStop.onclick=()=>busy?.abort?.();
askBtn.onclick=()=>{const q=aiIn.value.trim();if(q)makePage(q)};
async function makePage(what){
  if(!sample||busy)return;busy=new AbortController();
  askBtn.hidden=true;aiStop.hidden=false;aiMsg.textContent=`Claude is drawing “${what}”… about 20–40 seconds · बना रहे हैं…`;
  const prompt=`Draw a colouring-book page for a young child (age 4-8) of: "${what}". The request may be in Hindi or English.
Rules:
- Reply with ONLY one SVG element, nothing else. viewBox="0 0 800 600".
- Thick black outlines: every shape stroke="#000" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" fill="#fff". Every outline must be a CLOSED shape (end paths with Z) so a paint bucket cannot leak.
- Use only path, circle, ellipse, rect, polygon. No text, no gradients, no images, no filters, no shading or hatching, no open lines.
- Big, simple shapes, about 10-30 of them. Friendly, cute style. Fill most of the page.`;
  try{
    const {text}=await sample(prompt,{signal:busy.signal,cache:false});
    const m=text.match(/<svg[\s\S]*<\/svg>/i);if(!m)throw{code:'bad_svg'};
    let s=m[0].replace(/<script[\s\S]*?<\/script>/gi,'').replace(/\son\w+="[^"]*"/gi,'').replace(/<svg([^>]*?)\s(width|height)="[^"]*"/g,'<svg$1').replace(/<svg([^>]*?)\s(width|height)="[^"]*"/g,'<svg$1');
    if(!/xmlns=/.test(s))s=s.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');if(!/viewBox=/.test(s))s=s.replace('<svg','<svg viewBox="0 0 800 600"');
    aiBox.hidden=true;await loadPage({en:cap(what),hi:'',svg:s});
  }catch(e){
    if(['not_granted','sampling_disabled','not_declared'].includes(e?.code)){sample=null;aiMsg.textContent='';return}
    aiMsg.textContent=e?.code==='cancelled'?'':e?.code==='rate_limited'?'Too many tries. Wait a minute. · थोड़ा रुको।':'That didn\'t work. Tap again. · फिर से दबाओ।';
  }finally{busy=null;aiStop.hidden=true;askBtn.hidden=!sample}
}

/* ---------- guess it: DoodleNet, a free open-source model running on the device ---------- */
const gEn=$('gEn'),gHi=$('gHi'),gAlt=$('gAlt');
let tfP=null,model=null,LABELS=null,guessing=false;
function loadBrain(){return tfP||(tfP=new Promise((res,rej)=>{if(window.tf)return res();const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})
  .then(()=>Promise.all([fetch('lib/doodlenet.json').then(r=>r.json()).then(j=>{const bin=atob(j.b64),u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return tf.loadLayersModel(tf.io.fromMemory({modelTopology:j.modelTopology,weightSpecs:j.weightSpecs,weightData:u.buffer}))}),
    fetch('lib/doodle_labels.json').then(r=>r.json())]))
  .then(([m,l])=>{model=m;LABELS=l}).catch(e=>{tfP=null;throw e}))}
function doodleInput(){
  const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){const i=(y*w+x)*4;if(d[i]+d[i+1]+d[i+2]<690){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return null;
  const N=112,side=Math.max(x1-x0,y1-y0)*1.15+16,sx=(x0+x1)/2-side/2,sy=(y0+y1)/2-side/2;
  const ax=Math.max(0,sx),ay=Math.max(0,sy),bx=Math.min(w,sx+side),by=Math.min(h,sy+side);
  const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,N,N);
  x.drawImage(cv,ax,ay,bx-ax,by-ay,(ax-sx)/side*N,(ay-sy)/side*N,(bx-ax)/side*N,(by-ay)/side*N);
  const p=x.getImageData(0,0,N,N).data,ink=new Uint8Array(N*N),dil=new Uint8Array(N*N);
  for(let i=0;i<N*N;i++)ink[i]=(p[i*4]+p[i*4+1]+p[i*4+2])<690?1:0;
  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){if(!ink[y*N+xx])continue;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const a=y+dy,b=xx+dx;if(a>=0&&a<N&&b>=0&&b<N)dil[a*N+b]=1}}
  const out=new Float32Array(784);
  for(let y=0;y<28;y++)for(let xx=0;xx<28;xx++){let s=0;for(let dy=0;dy<4;dy++)for(let dx=0;dx<4;dx++)s+=dil[(y*4+dy)*N+xx*4+dx];out[y*28+xx]=s/16}
  return out}
const an=w=>/^[aeiou]/i.test(w)?'an':'a';
async function guess(){await bake();
  if(guessing)return;guessing=true;gAlt.textContent='';
  gEn.textContent='Hmm… let me look!';gHi.textContent='रुको, देखता हूँ…';$('guessBox').hidden=false;
  try{
    const input=doodleInput();
    if(!input){gEn.textContent='Draw something first!';gHi.textContent='पहले कुछ बनाओ!';return}
    if(!model){gEn.textContent='Getting ready… (first time takes a few seconds)';gHi.textContent='तैयार हो रहे हैं…';await loadBrain()}
    const probs=tf.tidy(()=>model.predict(tf.tensor(input,[1,28,28,1])).dataSync());
    const top=[...probs].map((p,i)=>[p,i]).filter(([,i])=>!LABELS[i][2]).sort((a,b)=>b[0]-a[0]).slice(0,3);
    const L1=LABELS[top[0][1]],L2=LABELS[top[1][1]],L3=LABELS[top[2][1]];
    if(top[0][0]>0.45){gEn.textContent=`I think it's ${an(L1[0])} ${L1[0]}!`;gHi.textContent=`मुझे लगता है यह ${L1[1]} है!`}
    else{gEn.textContent=`Is it ${an(L1[0])} ${L1[0]}? Or ${an(L2[0])} ${L2[0]}?`;gHi.textContent=`क्या यह ${L1[1]} है? या ${L2[1]}?`}
    gAlt.textContent=`Other guesses · और अंदाज़े: ${L2[0]} (${L2[1]}), ${L3[0]} (${L3[1]})`;
  }catch(e){console.warn(e);gEn.textContent='I could not get ready. Check the internet and tap Guess it again.';gHi.textContent='इंटरनेट देखो और फिर से दबाओ।'}
  finally{guessing=false}
}
function speak(t,lang){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.9;speechSynthesis.speak(u)}catch(_){}}
$('sayEn').onclick=()=>speak(gEn.textContent,'en-IN');
$('sayHi').onclick=()=>speak(gHi.textContent,'hi-IN');
$('gClose').onclick=()=>{$('guessBox').hidden=true};

(async()=>{try{if(!window.claude?.use)return;
  claude.use('sample').then(s=>{sample=s}).catch(()=>{});
  downloads=await claude.use('downloads')}catch(_){}})();

/* ---------- boot ---------- */
setColor(st.color);setTool('fill');
requestAnimationFrame(()=>{resize();colorPage()});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,150)});
document.addEventListener('gesturestart',e=>e.preventDefault());
})();
</script>
